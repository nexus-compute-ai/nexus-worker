[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-worker"
version = "0.1.2"
description = "Provider daemon for NexusCompute: Monetize your GPU by serving AI inference."
readme = "README.md"
authors = [{ name = "NexusCompute Network", email = "providers@nexuscompute.ai" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
    "websockets>=12.0",
    "click>=8.1.7",
    "rich>=13.7.0",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://nexus-compute.pages.dev"
Repository = "https://github.com/nexus-compute-ai/nexus-worker"
Documentation = "https://github.com/nexus-compute-ai/nexus-worker#readme"

[project.scripts]
nexus-worker = "nexus_worker.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_worker*"]
